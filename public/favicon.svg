<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Planet Crafter Map</title>
  <!-- Original mark for this project (no game art): a map pin holding a ringed planet over a grid. -->
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#56d364"/>
      <stop offset="1" stop-color="#1f9e8f"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="#0d1117"/>
    <path d="M0 128H512M0 256H512M0 384H512M128 0V512M256 0V512M384 0V512" stroke="#21262d" stroke-width="8"/>
  </g>
  <path d="M256 64c-82 0-148 66-148 148 0 108 148 236 148 236s148-128 148-236c0-82-66-148-148-148z" fill="url(#pin)"/>
  <circle cx="256" cy="212" r="88" fill="#0d1117"/>
  <g transform="translate(256 212) rotate(-22)" fill="none" stroke-linecap="round">
    <path d="M-68 0A68 22 0 0 1 68 0" stroke="#a5f2c8" stroke-width="10"/>
    <circle r="38" fill="#a5f2c8"/>
    <path d="M-68 0A68 22 0 0 0 68 0" stroke="#0d1117" stroke-width="24"/>
    <path d="M-68 0A68 22 0 0 0 68 0" stroke="#a5f2c8" stroke-width="10"/>
  </g>
</svg>
